services:
  system-monitor-api:
    build:
      context: .
    image: system-monitor-api:${IMAGE_TAG:-local}
    container_name: system-monitor-api
    environment:
      APP_NAME: ${APP_NAME:-System Health & Service Monitoring API}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    restart: unless-stopped
