# SonarQube project identity and source/test boundaries.
sonar.projectKey=system-monitor-api
sonar.projectName=System Monitor API
sonar.sourceEncoding=UTF-8
sonar.sources=app
sonar.tests=tests

# The API supports modern Python versions; CI currently runs Python 3.14.
sonar.python.version=3.11,3.12,3.13,3.14

# Created by pytest-cov in the Jenkins Test stage.
sonar.python.coverage.reportPaths=coverage.xml
